services:
  - type: web
    name: mr-nor-emoji-world
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TEACHER_PIN
        sync: false
      - key: SHEETS_URL
        sync: false
      - key: SHEETS_SECRET
        sync: false
